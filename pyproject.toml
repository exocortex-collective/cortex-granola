[project]
name = "cortex-granola"
version = "0.1.0"
description = "Granola meeting-note ingest for Cortex: polling now, push later, one ingest seam"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortex-utils @ git+https://github.com/devonjones/cortex-utils.git@f4d556e",
    "psycopg2-binary>=2.9.0",
    "prometheus-client>=0.16.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "bandit>=1.7.0",
    "vulture>=2.11",
    "types-psycopg2>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# cortex-utils is a git dependency pinned to a SHA, as in postmark and gateway.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_granola"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The reviewer pack teaches by contrast: its "# BAD" python blocks are
# deliberately malformed, and formatting them erases the lesson.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "cortex_utils.*"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
markers = [
    "live: requires a real Postgres (CORTEX_TEST_DSN). Collected by the CI anti-skip guard.",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
